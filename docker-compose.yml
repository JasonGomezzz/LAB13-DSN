name: lab13-dsn

# AWS local (DynamoDB + S3) para desarrollar y probar sin tocar la cuenta real.
services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: lab13-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: dynamodb,s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"dynamodb\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  localstack-data:
